name: postgresql

# =====================
# SHARED ANCHORS
# =====================

x-etcd-healthcheck: &etcd-healthcheck
  healthcheck:
    test: ["CMD", "etcdctl", "endpoint", "health"]
    interval: 10s
    timeout: 5s
    retries: 5

x-patroni-common: &patroni-common
  build: ./docker/patroni
  image: pg-patroni:latest
  restart: unless-stopped
  user: root
  entrypoint: >
    bash -c "chmod 700 /var/lib/postgresql/data &&
             chown -R postgres:postgres /var/lib/postgresql &&
             exec gosu postgres /entrypoint.sh"
  networks:
    - pg-network

services:
  # =====================
  # ETCD CLUSTER
  # =====================

  etcd-poc01:
    image: quay.io/coreos/etcd:v3.6.9
    container_name: etcd-poc01
    restart: unless-stopped
    volumes:
      - ${DATA_DB_DIR}/etcd01:/etcd-data
    environment:
      ETCD_NAME: etcd-poc01
      ETCDCTL_API: 3
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-poc01:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-poc01:2380
      ETCD_INITIAL_CLUSTER: etcd-poc01=http://etcd-poc01:2380,etcd-poc02=http://etcd-poc02:2380,etcd-poc05=http://etcd-poc05:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: pg-etcd-cluster
    ports:
      - "2379:2379"
    networks:
      - pg-network
    <<: *etcd-healthcheck

  etcd-poc02:
    image: quay.io/coreos/etcd:v3.6.9
    container_name: etcd-poc02
    restart: unless-stopped
    volumes:
      - ${DATA_DB_DIR}/etcd02:/etcd-data
    environment:
      ETCD_NAME: etcd-poc02
      ETCDCTL_API: 3
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-poc02:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-poc02:2380
      ETCD_INITIAL_CLUSTER: etcd-poc01=http://etcd-poc01:2380,etcd-poc02=http://etcd-poc02:2380,etcd-poc05=http://etcd-poc05:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: pg-etcd-cluster
    networks:
      - pg-network
    <<: *etcd-healthcheck

  etcd-poc05:
    image: quay.io/coreos/etcd:v3.6.9
    container_name: etcd-poc05
    restart: unless-stopped
    volumes:
      - ${DATA_DB_DIR}/etcd05:/etcd-data
    environment:
      ETCD_NAME: etcd-poc05
      ETCDCTL_API: 3
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-poc05:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-poc05:2380
      ETCD_INITIAL_CLUSTER: etcd-poc01=http://etcd-poc01:2380,etcd-poc02=http://etcd-poc02:2380,etcd-poc05=http://etcd-poc05:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: pg-etcd-cluster
    networks:
      - pg-network
    <<: *etcd-healthcheck

  # =====================
  # POSTGRES + PATRONI
  # =====================

  pg-primary:
    <<: *patroni-common
    container_name: pg-primary
    networks:
      - pg-network
      - monitoring-network
    volumes:
      - poc01_data:/var/lib/postgresql/data
    environment:
      PATRONI_NAME: pg-primary
      PATRONI_SCOPE: pg-ha-cluster
      PATRONI_ETCD3_HOSTS: etcd-poc01:2379,etcd-poc02:2379,etcd-poc05:2379
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-primary:5432
      PATRONI_POSTGRESQL_PARAMETERS: |
        archive_mode=on
        archive_command='pgbackrest --stanza=prod archive-push %p'
        wal_level=replica
        max_wal_senders=10
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-primary:8008
      PATRONI_SUPERUSER_USERNAME: ${PG_SUPERUSER_USER:-postgres}
      PATRONI_SUPERUSER_PASSWORD: ${PG_SUPERUSER_PASSWORD:-postgres}
      PATRONI_REPLICATION_USERNAME: ${PG_REPLICATION_USER:-replicator}
      PATRONI_REPLICATION_PASSWORD: ${PG_REPLICATION_PASSWORD:-replicator_pass}
      PATRONI_REWIND_PASSWORD: ${PG_REWIND_PASSWORD:-rewind_pass}
      PG_ROLE: primary
    ports:
      - "5432:5432"
      - "8008:8008"
    depends_on:
      etcd-poc01:
        condition: service_healthy
      etcd-poc02:
        condition: service_healthy
      etcd-poc05:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/primary || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  pg-replica:
    <<: *patroni-common
    container_name: pg-replica
    volumes:
      - poc03_data:/var/lib/postgresql/data
    environment:
      PATRONI_NAME: pg-replica
      PATRONI_SCOPE: pg-ha-cluster
      PATRONI_ETCD3_HOSTS: etcd-poc01:2379,etcd-poc02:2379,etcd-poc05:2379
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-replica:5432
      PATRONI_POSTGRESQL_PARAMETERS: |
        archive_mode=on
        archive_command='pgbackrest --stanza=prod archive-push %p'
        wal_level=replica
        max_wal_senders=10
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-replica:8008
      PATRONI_SUPERUSER_USERNAME: ${PG_SUPERUSER_USER:-postgres}
      PATRONI_SUPERUSER_PASSWORD: ${PG_SUPERUSER_PASSWORD:-postgres}
      PATRONI_REPLICATION_USERNAME: ${PG_REPLICATION_USER:-replicator}
      PATRONI_REPLICATION_PASSWORD: ${PG_REPLICATION_PASSWORD:-replicator_pass}
      PATRONI_REWIND_PASSWORD: ${PG_REWIND_PASSWORD:-rewind_pass}
      PG_ROLE: read_replica
    networks:
      - pg-network
      - monitoring-network  
    ports:
      - "8009:8008"
    depends_on:
      pg-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # =====================
  # PGBOUNCER
  # =====================

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: haproxy
      DB_PORT: 6433
      DB_USER: ${PG_SUPERUSER_USER:-postgres}
      DB_PASSWORD: ${PG_SUPERUSER_PASSWORD:-postgres}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
    ports:
      - "6432:5432"
    networks:
      - pg-network
    depends_on:
      pg-primary:
        condition: service_healthy

  # =====================
  # HAPROXY
  # =====================

  haproxy:
    image: haproxy:latest
    container_name: haproxy
    restart: unless-stopped
    volumes:
      - ./config/haproxy/haproxy-prd.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "6433:6433"
    networks:
      - pg-network
      - monitoring-network
    depends_on:
      pg-primary:
        condition: service_healthy

  # =====================
  # PGBACKREST
  # =====================

 #   pgbackrest:
 #     image: ghcr.io/pgbackrest/pgbackrest:latest
 #     container_name: pgbackrest
 #     restart: unless-stopped
 #     volumes:
 #       - ${DATA_DB_DIR}/pgbackrest:/var/lib/pgbackrest
 #       - ${DATA_DB_DIR}/wal-archive:/var/lib/wal
 #     environment:
 #       PGBACKREST_REPO1_TYPE: s3
 #       PGBACKREST_REPO1_S3_BUCKET: ${S3_BUCKET}
 #       PGBACKREST_REPO1_S3_REGION: ${AWS_REGION}
 #       PGBACKREST_REPO1_S3_ENDPOINT: s3.amazonaws.com
 #       PGBACKREST_REPO1_S3_KEY: ${AWS_ACCESS_KEY_ID}
 #       PGBACKREST_REPO1_S3_KEY_SECRET: ${AWS_SECRET_ACCESS_KEY}
 #       PGBACKREST_STANZA: prod
 #     depends_on:
 #       - pg-primary
 #     networks:
 #       - pg-network

volumes:
  poc01_data:
  poc03_data:

networks:
  pg-network:
    driver: bridge
    name: pg-network
  monitoring-network:
    external: true
    name: monitoring-network